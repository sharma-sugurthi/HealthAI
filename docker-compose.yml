version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: susruta-postgres
    environment:
      POSTGRES_DB: susruta
      POSTGRES_USER: susruta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-susruta_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susruta"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susruta-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: susruta-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://susruta:${POSTGRES_PASSWORD:-susruta_password}@postgres:5432/susruta
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - susruta-network
    restart: unless-stopped

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: susruta-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - susruta-network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local

networks:
  susruta-network:
    driver: bridge
